<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Adopción</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page-shell">
        <main class="form-card">
            <h1>Formulario de Adopción de Mascotas</h1>
            <p class="intro">Completá todos los campos para solicitar la adopción de una mascota.</p>

            <form action="#" method="post">

    <h2 class="section-title">Datos personales</h2>

    <div class="field-group">
        <div>
            <label for="nombre">Nombre y apellido:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div>
            <label for="dni">DNI:</label>
            <input type="text" id="dni" name="dni" required>
        </div>

        <div>
            <label for="fecha">Fecha de nacimiento:</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>

        <div>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>
        </div>

        <div>
            <label for="telefono">Número de teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
        </div>

        <div>
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" required>
        </div>
    </div>

    <h2 class="section-title">Información sobre la mascota</h2>

    <div>
        <label for="mascota">¿Qué mascota queres adoptar?</label>
        <select id="mascota" name="mascota" required>
            <option value="">Elija una opción</option>
            <option value="perro">Perro</option>
            <option value="gato">Gato</option>
            <option value="conejo">Conejo</option>
            <option value="hamster">Hamster</option>
            <option value="otro">Otro</option>
        </select>
    </div>

    <div>
        <label for="edad">¿Qué edad preferis?</label>
        <select id="edad" name="edad" required>
            <option value="">Elija una opción</option>
            <option value="bebe">Bebé</option>
            <option value="joven">Joven</option>
            <option value="adulto">Adulto</option>
            <option value="mayor">Adulto mayor</option>
            <option value="indiferente">No tengo preferencia</option>
        </select>
    </div>

    <fieldset>
        <legend>¿Tenes otras mascotas en tu hogar?</legend>

        <div class="option-row">
            <input type="radio" id="mascotas-si" name="otras-mascotas" value="si" required>
            <label for="mascotas-si">Sí</label>
        </div>

        <div class="option-row">
            <input type="radio" id="mascotas-no" name="otras-mascotas" value="no">
            <label for="mascotas-no">No</label>
        </div>
    </fieldset>

    <fieldset>
        <legend>¿Dónde vivirá la mascota?</legend>

        <div class="option-row">
            <input type="radio" id="casa" name="vivienda" value="casa" required>
            <label for="casa">Casa</label>
        </div>

        <div class="option-row">
            <input type="radio" id="departamento" name="vivienda" value="departamento">
            <label for="departamento">Departamento</label>
        </div>

        <div class="option-row">
            <input type="radio" id="casa-patio" name="vivienda" value="casa-patio">
            <label for="casa-patio">Casa con patio</label>
        </div>

        <div class="option-row">
            <input type="radio" id="ph" name="vivienda" value="ph">
            <label for="ph">PH</label>
        </div>
    </fieldset>

    <fieldset>
        <legend>¿Qué espacios tenes disponibles para la mascota?</legend>

        <div class="option-row">
            <input type="checkbox" id="interior" name="espacios" value="interior">
            <label for="interior">Espacio interior</label>
        </div>

        <div class="option-row">
            <input type="checkbox" id="patio" name="espacios" value="patio">
            <label for="patio">Patio</label>
        </div>

        <div class="option-row">
            <input type="checkbox" id="balcon" name="espacios" value="balcon">
            <label for="balcon">Balcón</label>
        </div>
    </fieldset>

    <div>
        <label for="tiempo">
            ¿Cuánto tiempo podría dedicarle diariamente a la mascota?
        </label>

        <select id="tiempo" name="tiempo" required>
            <option value="">Elija una opción</option>
            <option value="menos-1">Menos de 1 hora</option>
            <option value="1-2">Entre 1 y 2 horas</option>
            <option value="2-4">Entre 2 y 4 horas</option>
            <option value="mas-4">Más de 4 horas</option>
        </select>
    </div>

    <div>
        <label for="motivo">
            ¿Por qué quiere adoptar una mascota?
        </label>

        <textarea id="motivo" name="motivo" rows="6" cols="50"
                  placeholder="Contanos por qué queres adoptar..."
                  required></textarea>
    </div>

    <div>
        <label for="experiencia">
            ¿Tuvo mascotas anteriormente? Contanos sobre tu experiencia:
        </label>

        <textarea id="experiencia" name="experiencia" rows="5" cols="50"
                  placeholder="Contanos qué mascotas tuviste y cómo fue tu experiencia..."
                  required></textarea>
    </div>

    <div class="option-row">
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">
            Confirmo que la información dada es verdadera y que me comprometo a cuidar responsablemente de la mascota.
        </label>
    </div>

    <div class="actions">
        <button type="submit">Enviar solicitud de adopción</button>
        <button type="reset">Limpiar formulario</button>
    </div>

            </form>
        </main>
    </div>

</body>
</html>
